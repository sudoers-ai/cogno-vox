[project]
name = "cogno-vox"
version = "0.1.0"
description = "Voice/audio I/O edge for the Cogno cognitive pipeline — speech-to-text (STT) in, text-to-speech (TTS) out, with provider-agnostic fallback chains"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sudoers AI" }]
keywords = ["llm", "stt", "tts", "whisper", "speech-to-text", "text-to-speech", "voice", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# The CORE (ports + OpenAI-compatible HTTP backends + fallback chains) needs httpx;
# the fallback chains' resilience (breaker/retry/metrics) comes from cogno-homeo.
# Provider SDKs are lazy-imported behind the optional extras below.
dependencies = ["httpx>=0.24", "cogno-homeo>=0.1,<0.2"]

[project.urls]
Homepage = "https://github.com/sudoers-ai/cogno-vox"
Repository = "https://github.com/sudoers-ai/cogno-vox"
Issues = "https://github.com/sudoers-ai/cogno-vox/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.8",
    # the dia_server unit tests exercise the FastAPI app with a fake engine; without
    # fastapi they importorskip and the module shows 0% coverage in CI.
    "fastapi>=0.110",
    "httpx>=0.27",
]
# Provider SDKs — install only what you wire up. The OpenAI-compatible HTTP
# backends (faster-whisper-server, Kokoro, OpenAI, Groq) need no SDK, just httpx.
bedrock = ["boto3>=1.34"]
# The Dia expressive-TTS wrapper server (python -m cogno_vox.dia_server). The dia lib +
# torch are installed separately (community checkpoints need the pre-0626 dia commit).
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cogno_vox*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the repo root on sys.path so tests can import the decoupled `cognobench`
# harness (not part of the installed wheel — packages.find is cogno_vox*).
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["cogno_vox"]
warn_unused_ignores = true
