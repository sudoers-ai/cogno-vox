name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per workflow per ref. A push that supersedes a still-running run cancels it
# instead of paying for both: measured over 30 days on cogno-host, 1526 of 3016 billed CI minutes
# (51%) went to runs a newer push had already made obsolete.
#
# The key is WORKFLOW + ref, not ref alone. A ref-only group would put this workflow and the
# publish workflow beside it into the SAME group on a push to main, so a release could cancel CI,
# or CI a release. A group is a lane; two workflows that mean different things do not share one.
#
# `main` is EXEMPT from cancellation, deliberately. A push to main is a commit nobody will
# re-push, so cancelling its run leaves that commit with no verdict at all — and main is the ref
# a release tag is cut from. On main the group still SERIALISES (a second run queues behind the
# first) rather than cancelling: the waste this exists to stop is iterating on a PR, not merging,
# and merges are already serialised by review. On a pull_request event github.ref is
# refs/pull/<n>/merge, never refs/heads/main, so PR runs always cancel — which is where the 51%
# is. The cost of the exemption is therefore close to zero and it buys back a per-commit verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # cogno-homeo (not yet on PyPI) from git — vox imports it at runtime.
          pip install "cogno-homeo @ git+https://github.com/sudoers-ai/cogno-homeo.git"
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check cogno_vox cognobench tests examples
      - name: Type-check (mypy)
        run: mypy cogno_vox
      - name: Install the vision extra (AFTER mypy, on purpose)
        # Not in `[dev]`: numpy ships stubs written in 3.12 syntax, which mypy REJECTS under
        # `python_version = "3.10"` — and it fails before reaching our code ("errors prevented
        # further checking"). Installed here so the type-check never meets them and the test
        # suite still exercises `video_sampler` for real; without it the module sits at 25%
        # coverage and the tests behave differently here than on a machine that happens to
        # have opencv — which is the very defect this PR fixes.
        run: pip install -e ".[vision]"
      - name: Unit tests
        # Integration tests against a real local Whisper/Kokoro server auto-skip
        # without VOX_*_BASE_URL env vars; the unit suite mocks all HTTP.
        run: pytest tests/unit -q --cov=cogno_vox --cov-report=term-missing --cov-fail-under=90
      - name: Voice bench smoke (deterministic, no network)
        run: python voxbench.py --stub --max-wer 0.0
      - name: Integration tests (auto-skip without STT/TTS servers)
        run: pytest tests/integration -q
