name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check cogno_vox tests examples
      - name: Type-check (mypy)
        run: mypy cogno_vox
      - name: Unit tests
        # Integration tests against a real local Whisper/Kokoro server auto-skip
        # without VOX_TEST_* env vars; the unit suite mocks all HTTP.
        run: pytest tests/unit -q --cov=cogno_vox --cov-report=term-missing --cov-fail-under=90
